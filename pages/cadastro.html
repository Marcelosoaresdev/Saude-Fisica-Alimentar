<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - LifeHub</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- CSS principal -->
  <link rel="stylesheet" href="../css/login.css" />

  <link rel="icon" href="../imagens/favicon.ico" />
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../imagens/android-chrome-512x512-removebg-preview.png" alt="logo" width="40" height="40"
          class="me-2">
        <span class="fw-bold">LifeHub</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="planos.html">Planos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Nutrição</a></li>
          <li class="nav-item"><a class="nav-link" href="imc.html">Calculadora IMC</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Treinos</a></li>
          <li class="nav-item">
            <a class="nav-link btn btn-success-custom" href="cadastro.html">Comece Agora</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ================= CADASTRO ================= -->
  <main class="container">
    <section class="form-section" id="signup-section">

      <h1>Cadastro</h1>

      <form action="dashboard.html" method="POST">

        <!-- Nome -->
        <div class="input-box">
          <input type="text" name="nome" placeholder="Nome completo" required />
          <i class="bx bxs-user"></i>
        </div>

        <!-- Email -->
        <div class="input-box">
          <input type="email" name="email" placeholder="Email institucional" required
            pattern=".+@(unifoa\.edu\.br|foa\.org\.br)" title="Use email institucional válido!" />
          <i class="bx bxs-envelope"></i>
        </div>

        <form id="form-endereco">
          <div class="input-box">
            <input id="cep" type="text" name="CEP" placeholder="CEP" required pattern="\d{5}-?\d{3}"
              title="Utilize um CEP válido" />
            <i class="bx bxs-user"></i>
          </div>

          <div class="input-box">
            <input id="logradouro" type="text" name="Logradouro" placeholder="Logradouro" required />
            <i class="bx bxs-user"></i>
          </div>

          <div class="input-box">
            <input id="bairro" type="text" name="Bairro" placeholder="Bairro" required />
            <i class="bx bxs-user"></i>
          </div>

          <div class="input-box">
            <input id="cidade" type="text" name="Cidade" placeholder="Cidade" required />
            <i class="bx bxs-user"></i>
          </div>

          <div class="input-box">
            <input id="uf" type="text" name="UF" placeholder="UF" required />
            <i class="bx bxs-user"></i>
          </div>

          <div id="modal-erro" class="modal-erro-overlay" style="display:none;">
            <div class="modal-erro-content">
              <span id="modal-erro-msg"></span>
            </div>
          </div>

        </form>


        <!-- Senha -->
        <div class="input-box">
          <input type="password" name="senha" placeholder="Senha (6-10 caracteres)" required
            pattern="(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{6,10}" title="Senha: 6 a 10 caracteres com letras e números" />
          <i class="bx bxs-lock-alt"></i>
        </div>

        <!-- Botão -->
        <button type="submit" class="login">Cadastrar</button>

        <!-- Link -->
        <p class="switch-form">
          Já tem uma conta? <a href="login.html">Login</a>
        </p>

      </form>
    </section>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/log.js" defer></script>
  <script src="../js/CEP.js" defer></script>
</body>

</html>
